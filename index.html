<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PBOOK</title>
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="PBOOK - Cast Your Vote!" />
    <meta property="og:description" content="Participate in our latest polls and make your voice heard." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1540910419892-4a36d2c3266c?w=1200&h=630&fit=crop" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PBOOK - Cast Your Vote!" />
    <meta name="twitter:description" content="Participate in our latest polls and make your voice heard." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1540910419892-4a36d2c3266c?w=1200&h=630&fit=crop" />

    <!-- Adsterra Native Ads & Analytics -->
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Early intercept of cross-origin third-party script errors (e.g. ad networks, tracking)
      window.onerror = function (msg, url, lineNo, columnNo, error) {
        if (msg === 'Script error.' || !url || (typeof msg === 'string' && msg.includes('Script error'))) {
          // Suppress unhandled third party / cross-origin script errors
          return true;
        }
        return false;
      };
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason ? (event.reason.message || String(event.reason)) : '';
        if (reason.indexOf('Script error') !== -1 || reason.indexOf('Failed to fetch') !== -1) {
          event.preventDefault();
        }
      });
    </script>
    <style>
      .app-loader {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        background-color: #f8fafc;
      }
      .app-loader-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #cbd5e1;
        border-top: 4px solid #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loader">
        <div class="app-loader-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration error:', err);
          });
        });
      }
    </script>
  </body>
</html>
